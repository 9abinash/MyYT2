name: Build YouTube APK
on: { workflow_dispatch: {}, push: { branches: [main, master] } }
permissions: { contents: read }
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Verify complete source
        run: test -f app/src/main/assets/www/index.html
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: mkdir -p artifacts && cp app/build/outputs/apk/debug/app-debug.apk artifacts/YouTube.apk
      - uses: actions/upload-artifact@v4
        with: { name: YouTube-APK, path: artifacts/YouTube.apk, if-no-files-found: error }
